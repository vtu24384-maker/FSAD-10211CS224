<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Confirmed — ShopZone</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

<nav class="navbar">
  <a href="/" class="nav-logo">SHOP<span>ZONE</span></a>
  <div class="nav-links">
    <span style="font-size:0.72rem;color:#555;letter-spacing:0.1em;text-transform:uppercase;" th:text="${userName}"></span>
  </div>
</nav>

<div class="receipt-wrap">

  <div class="receipt-success">
    <div class="receipt-check">✓</div>
    <h1 class="receipt-title">ORDER CONFIRMED</h1>
    <p class="receipt-sub">THANK YOU, <span style="color:#fff;" th:text="${order.user.name}"></span>. YOUR ORDER HAS BEEN PLACED.</p>
  </div>

  <div class="receipt-card">

    <!-- Header -->
    <div class="receipt-header">
      <div>
        <div style="font-size:0.6rem;letter-spacing:0.2em;color:#444;text-transform:uppercase;margin-bottom:0.3rem;">ORDER ID</div>
        <div class="receipt-order-id">#<span th:text="${orderId}"></span></div>
      </div>
      <div class="receipt-date">
        <div style="font-size:0.6rem;letter-spacing:0.15em;color:#444;text-transform:uppercase;margin-bottom:0.3rem;">DATE</div>
        <div th:text="${orderDate}"></div>
      </div>
    </div>

    <!-- Meta -->
    <div class="receipt-meta">
      <div class="receipt-meta-item">
        <div class="receipt-meta-label">Customer</div>
        <div class="receipt-meta-value" th:text="${order.user.name}"></div>
      </div>
      <div class="receipt-meta-item">
        <div class="receipt-meta-label">Email</div>
        <div class="receipt-meta-value" th:text="${order.user.email}"></div>
      </div>
      <div class="receipt-meta-item">
        <div class="receipt-meta-label">Payment</div>
        <div class="receipt-meta-value"
             th:text="${order.paymentMethod == 'card' ? 'Credit / Debit Card' : (order.paymentMethod == 'upi' ? 'UPI' : 'Cash on Delivery')}"></div>
      </div>
      <div class="receipt-meta-item">
        <div class="receipt-meta-label">Status</div>
        <span class="status-badge" th:text="${order.status}"></span>
      </div>
    </div>

    <!-- Items -->
    <div class="receipt-items">
      <div style="font-size:0.6rem;letter-spacing:0.2em;color:#444;text-transform:uppercase;margin-bottom:1rem;">ITEMS ORDERED</div>
      <div th:each="item : ${order.items}" class="receipt-item-row">
        <span style="color:#888;">
          <span th:text="${item.name}"></span>
          <span style="color:#444;"> × <span th:text="${item.quantity}"></span></span>
        </span>
        <span style="color:#e0e0e0;font-weight:600;">₹<span th:text="${#numbers.formatDecimal(item.price * item.quantity,1,2)}"></span></span>
      </div>
    </div>

    <!-- Total -->
    <div class="receipt-total">
      <div class="receipt-total-label">TOTAL PAID</div>
      <div class="receipt-total-amount">₹<span th:text="${#numbers.formatDecimal(order.total,1,2)}"></span></div>
    </div>
  </div>

  <!-- Actions -->
  <div class="receipt-actions" style="margin-top:1px;">
    <a th:href="@{/}" class="btn-primary">CONTINUE SHOPPING</a>
    <button onclick="window.print()" class="btn-primary" style="background:#111;color:#fff;border:1px solid #1a1a1a;">
      PRINT RECEIPT
    </button>
  </div>

</div>

<footer>
  <span class="footer-logo">SHOPZONE</span>
  <span class="footer-copy">© 2025 SHOPZONE. ALL RIGHTS RESERVED.</span>
</footer>
</body>
</html>
