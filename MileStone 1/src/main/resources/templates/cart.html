<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart — ShopZone</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

<nav class="navbar">
  <a href="/" class="nav-logo">SHOP<span>ZONE</span></a>
  <div class="nav-links">
    <a th:href="@{/}" class="nav-link">← CONTINUE SHOPPING</a>
  </div>
</nav>

<div class="page-header">
  <p style="font-size:0.65rem;letter-spacing:0.2em;color:#444;text-transform:uppercase;margin-bottom:0.5rem;">YOUR SELECTION</p>
  <h1 class="page-title">CART</h1>
</div>

<!-- Empty -->
<div th:if="${cartItems.empty}" class="empty-state">
  <span class="empty-icon">[ ]</span>
  <p class="empty-text">YOUR CART IS EMPTY</p>
  <a th:href="@{/}" class="btn-primary" style="max-width:200px;margin:2rem auto 0;display:block;">SHOP NOW</a>
</div>

<!-- Cart with items -->
<div th:unless="${cartItems.empty}">
  <div class="cart-layout">
    <!-- Items -->
    <div class="cart-items-col">
      <div th:each="item : ${cartItems}" class="cart-item">
        <img th:src="${item.product.image}" th:alt="${item.product.name}"
             class="cart-item-img"
             onerror="this.src='https://placehold.co/100x120/111/333?text=IMG'"/>
        <div>
          <div class="cart-item-name" th:text="${item.product.name}"></div>
          <div class="cart-item-price">₹<span th:text="${#numbers.formatDecimal(item.product.price,1,2)}"></span> EACH</div>
          <div class="qty-controls">
            <form th:action="@{/cart/update}" method="post" style="display:inline;">
              <input type="hidden" name="productId" th:value="${item.product.id}"/>
              <input type="hidden" name="quantity" th:value="${item.quantity - 1}"/>
              <button type="submit" class="qty-btn">−</button>
            </form>
            <span class="qty-num" th:text="${item.quantity}"></span>
            <form th:action="@{/cart/update}" method="post" style="display:inline;">
              <input type="hidden" name="productId" th:value="${item.product.id}"/>
              <input type="hidden" name="quantity" th:value="${item.quantity + 1}"/>
              <button type="submit" class="qty-btn">+</button>
            </form>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.75rem;">
          <span style="font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:#fff;">
            ₹<span th:text="${#numbers.formatDecimal(item.product.price * item.quantity,1,2)}"></span>
          </span>
          <form th:action="@{/cart/remove}" method="post">
            <input type="hidden" name="productId" th:value="${item.product.id}"/>
            <button type="submit" class="remove-btn">✕</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Summary -->
    <div class="cart-summary-col">
      <p class="summary-label">ORDER TOTAL</p>
      <div class="summary-total">₹<span th:text="${#numbers.formatDecimal(cartTotal,1,2)}"></span></div>
      <div style="font-size:0.65rem;color:#333;letter-spacing:0.1em;margin-bottom:2rem;line-height:1.8;">
        TAXES INCLUDED<br/>SHIPPING CALCULATED AT CHECKOUT
      </div>
      <a th:href="@{/checkout}" class="btn-primary">PROCEED TO CHECKOUT →</a>
      <a th:href="@{/}" class="btn-outline">CONTINUE SHOPPING</a>
    </div>
  </div>
</div>

<footer>
  <span class="footer-logo">SHOPZONE</span>
  <span class="footer-copy">© 2025 SHOPZONE. ALL RIGHTS RESERVED.</span>
</footer>
</body>
</html>
